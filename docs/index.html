<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Memo Todo</title>
<!-- 아이폰 '홈 화면에 추가' 시 앱처럼 열리게 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Memo Todo" />
<meta name="theme-color" content="#cdb6c0" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
  :root {
    --bg:#faf8f9; --ink:#555055; --ink-soft:#9e989d; --line:#f0eaed;
    --pink:#edd9e0; --pink-deep:#cdb0bb; --pink-soft:#f7f2f4;
    --titlebar:linear-gradient(180deg,#cdb6c0,#c4abb6);
    --c0:#f8f1f4; --c1:#f4f0f7; --c2:#eff5ef; --c3:#eff4f9; --c4:#f8f3ec; --c5:#f8f1f1;
    --a0:#d3a9b6; --a1:#b3a6cd; --a2:#a1c2a1; --a3:#a0bace; --a4:#cfba93; --a5:#d3a9a9;
  }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  html,body { height:100%; }
  body {
    font-family:'Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px;
    padding-top:env(safe-area-inset-top);
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  /* 편집 중(입력창/편집영역)에서만 텍스트 선택 허용 */
  input, textarea, [contenteditable="true"] { -webkit-user-select:text; user-select:text; }
  .hidden { display:none !important; }

  /* 인라인 아이콘 */
  .ic { width:1em; height:1em; display:inline-block; vertical-align:-0.13em;
    fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .ic-wrap { display:inline-flex; align-items:center; }

  /* ── 상단바 ── */
  .top {
    position:sticky; top:0; z-index:10; background:var(--titlebar); color:#fff;
    display:flex; align-items:center; gap:6px; padding:10px 12px;
    padding-top:calc(10px + env(safe-area-inset-top)); margin-top:calc(-1 * env(safe-area-inset-top));
  }
  .top b { font-size:16px; letter-spacing:-0.01em; }
  .top .sp { flex:1; }
  .top button {
    border:none; background:rgba(255,255,255,0.18); color:#fff; border-radius:9px;
    min-width:34px; height:32px; font-size:15px; padding:0 9px;
    display:inline-flex; align-items:center; justify-content:center;
  }
  .tabs { display:flex; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:52px; z-index:9; }
  .tabs button {
    flex:1; border:none; background:transparent; padding:11px 0; font-size:14px; font-weight:700;
    color:var(--ink-soft); border-bottom:2px solid transparent;
  }
  .tabs button.on { color:var(--pink-deep); border-bottom-color:var(--pink-deep); }

  .wrap { padding:12px 12px 90px; max-width:560px; margin:0 auto; }

  /* ── 카드 공통 ── */
  .card {
    background:#fff; border-radius:14px; padding:14px 14px 12px; margin-bottom:12px;
    box-shadow:0 2px 8px rgba(180,150,165,0.12); position:relative;
  }
  .card h3 { font-size:15px; margin-bottom:8px; word-break:break-word; }
  .pin { color:var(--pink-deep); margin-right:6px; }
  .pin .ic { width:1.2em; height:1.2em; vertical-align:-0.24em; }

  /* ── D-DAY ── */
  .dday-block {
    background:#fff; border-radius:14px; padding:10px 14px 12px; margin-bottom:12px;
    box-shadow:0 2px 8px rgba(180,150,165,0.12);
  }
  .dday-head { display:flex; align-items:center; margin-bottom:6px; }
  .dday-head b { font-size:12px; letter-spacing:0.06em; color:var(--pink-deep); flex:1; }
  .dday-add { border:none; background:var(--pink-soft); color:var(--pink-deep);
    width:26px; height:26px; border-radius:8px; font-size:17px; line-height:1;
    display:inline-flex; align-items:center; justify-content:center; }
  .add-line .ic { width:20px; height:20px; }
  .dday-empty { font-size:12.5px; color:var(--ink-soft); padding:4px 2px; }
  .dday-item { display:flex; align-items:center; gap:10px; padding:5px 0; }
  .dday-badge { min-width:52px; text-align:center; font-weight:700; font-size:12.5px; border:none;
    color:var(--pink-deep); background:var(--pink-soft); border-radius:8px; padding:6px 8px; }
  .dday-badge.today { color:#c67; }
  .dday-badge.past { color:var(--ink-soft); }
  .dday-name { flex:1; border:none; background:transparent; font-size:14px; color:var(--ink);
    outline:none; min-width:0; }
  .dday-del { border:none; background:transparent; color:var(--ink-soft); width:24px; height:24px;
    display:inline-flex; align-items:center; justify-content:center; }

  /* 예쁜 달력 모달 */
  .cal-overlay { position:fixed; inset:0; z-index:55; background:rgba(70,60,68,0.32);
    display:none; align-items:center; justify-content:center; padding:24px; }
  .cal-overlay.open { display:flex; }
  .cal { background:#fff; border-radius:18px; width:100%; max-width:320px; padding:16px 16px 12px;
    box-shadow:0 12px 34px rgba(110,90,105,0.32); }
  .cal-top { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .cal-title { flex:1; text-align:center; font-weight:700; font-size:15px; color:var(--ink); }
  .cal-nav { border:none; background:var(--pink-soft); color:var(--pink-deep); width:32px; height:32px;
    border-radius:9px; display:inline-flex; align-items:center; justify-content:center; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .cal-dow { text-align:center; font-size:11px; color:var(--ink-soft); padding:4px 0; }
  .cal-day { aspect-ratio:1; border:none; background:transparent; color:var(--ink); font-size:13px;
    border-radius:9px; display:flex; align-items:center; justify-content:center; }
  .cal-day.other { color:#d7d2d6; }
  .cal-day.today { box-shadow:inset 0 0 0 1.5px var(--pink-deep); font-weight:700; }
  .cal-day.sel { background:var(--pink-deep); color:#fff; font-weight:700; }
  .cal-foot { display:flex; gap:8px; margin-top:12px; }
  .cal-foot button { flex:1; border:none; border-radius:10px; padding:11px; font-size:14px; font-weight:700; }
  .cal-cancel { background:var(--pink-soft); color:var(--ink-soft); }
  .cal-ok { background:var(--pink-deep); color:#fff; }
  .num-row { display:flex; align-items:center; justify-content:center; gap:22px; margin:6px 0 4px; }
  .num-step { width:44px; height:44px; border:none; border-radius:12px; background:var(--pink-soft); color:var(--pink-deep); font-size:22px; }
  .num-val { font-size:26px; font-weight:700; min-width:44px; text-align:center; color:var(--ink); }

  /* ── 투두 ── */
  .item.dragging { background:var(--pink-soft); border-radius:8px; }
  .item-row { position:relative; overflow:hidden; }
  .item-inner { display:flex; align-items:flex-start; gap:9px; padding:6px 0; transition:transform 0.18s; }
  .item input[type=checkbox] {
    width:19px; height:19px; margin-top:1px; accent-color:var(--pink-deep); flex-shrink:0;
  }
  .item .txt { flex:1; border:none; background:transparent; font-size:14px; color:var(--ink);
    outline:none; word-break:break-word; min-height:20px; }
  .item.done .txt { color:var(--ink-soft); text-decoration:line-through; }
  .prog-count { flex-shrink:0; font-size:12px; color:var(--pink-deep); font-weight:700; margin-top:2px; }
  .item-actions { position:absolute; top:0; right:0; bottom:0; display:flex; }
  .item-actions button { width:50px; border:none; color:#fff; display:flex; align-items:center; justify-content:center; }
  .item-actions .act-prog { background:#b3a6cd; }
  .item-actions .act-del { background:#e0a6a6; }
  .item-actions .ic { width:17px; height:17px; }
  /* 세부항목별 분절 진행도 게이지 (해당 항목 아래) */
  .item-prog { margin:1px 0 6px 30px; }
  .pboxes { display:grid; gap:3px; }
  .pseg { height:14px; border-radius:3px; background:var(--line); }
  .pseg.filled { background:var(--pink-deep); }
  /* 세부항목 추가 라인 */
  .add-line {
    display:block; width:100%; border:none; background:transparent; color:var(--pink-deep);
    font-size:20px; font-weight:700; padding:8px 0 2px; margin-top:4px;
    border-top:1px dashed var(--line); text-align:center; line-height:1;
  }

  /* ── 메모 목록 ── */
  .search-bar {
    position:sticky; top:88px; z-index:8; background:var(--bg); padding:2px 0 10px;
  }
  .search-bar .search-ic {
    position:absolute; left:14px; top:11px; color:var(--ink-soft); pointer-events:none;
  }
  .search-bar input {
    width:100%; border:1px solid var(--line); border-radius:20px; background:#fff;
    padding:9px 40px 9px 38px; font-size:14px; outline:none; font-family:inherit;
  }
  .search-clear { position:absolute; right:7px; top:6px; width:26px; height:26px; border:none;
    background:var(--line); color:var(--ink-soft); border-radius:50%;
    display:flex; align-items:center; justify-content:center; }
  .search-clear .ic { width:13px; height:13px; }
  .memo-row { display:flex; align-items:center; gap:6px; }
  .memo-row .m-title { font-weight:700; font-size:14px; flex:1; word-break:break-word; }
  /* 메모 카드 스와이프(왼쪽:색상·삭제 / 오른쪽:상단고정) */
  .mcard { overflow:hidden; padding:0; }
  .mcard .card-inner { padding:14px 14px 12px; border-radius:14px; transition:transform 0.18s;
    position:relative; z-index:1; }
  .card-actions { position:absolute; top:0; right:0; bottom:0; display:flex; z-index:0; }
  .card-actions button { width:56px; border:none; color:#fff; display:flex; align-items:center; justify-content:center; }
  .card-actions .act-color { background:#c1a6bd; }
  .card-actions .act-del { background:#e0a6a6; }
  .card-actions .ic { width:20px; height:20px; }
  .mcard.revealed .card-inner { transform:translateX(-112px); }
  .memo-prev { font-size:12.5px; color:var(--ink-soft); margin-top:6px;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .m-tags { margin-top:8px; display:flex; flex-wrap:wrap; gap:5px; }
  .m-tags span { font-size:11px; color:var(--ink-soft); background:var(--pink-soft);
    border-radius:20px; padding:2px 9px; }

  /* ── 하단 해시태그 필터 바 ── */
  .tag-bar {
    position:fixed; left:0; right:0; bottom:0; z-index:15; background:#fff;
    border-top:1px solid var(--line); display:flex; gap:7px; overflow-x:auto;
    padding:9px 12px calc(9px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch;
  }
  .tag-bar::-webkit-scrollbar { display:none; }
  .tag-bar button {
    flex-shrink:0; border:1px solid var(--line); background:var(--pink-soft); color:var(--ink-soft);
    border-radius:20px; padding:6px 13px; font-size:12.5px; white-space:nowrap;
  }
  .tag-bar button.on { background:var(--pink-deep); border-color:var(--pink-deep); color:#fff; }

  /* ── 메모 상세 ── */
  .sheet {
    position:fixed; inset:0; z-index:30; background:var(--bg); overflow-y:auto;
    padding-bottom:70px; -webkit-overflow-scrolling:touch;
  }
  .sheet .top button.save { background:#fff; color:var(--pink-deep); font-weight:700; }
  .sheet-body { max-width:560px; margin:0 auto; padding:16px 16px 40px; }
  #dv-title, #dv-content { outline:none; }
  #dv-title { font-size:20px; font-weight:700; margin-bottom:20px; min-height:28px; word-break:break-word; }
  #dv-title:empty::before { content:'제목'; color:var(--ink-soft); opacity:0.6; }
  #dv-content { font-size:15px; line-height:1.85; min-height:200px; word-break:break-word; white-space:pre-wrap; }
  #dv-content img { max-width:100%; height:auto; border-radius:8px; }
  #dv-content hr { border:none; border-top:1px solid var(--line); margin:8px 0; }
  #dv-content blockquote { margin:4px 0; padding-left:10px; border-left:3px solid var(--line); color:var(--ink-soft); }
  #dv-content ul, #dv-content ol { margin:4px 0; padding-left:22px; }
  #dv-content ul.md-check { list-style:none; padding-left:4px; }
  #dv-content ul.md-check > li { position:relative; padding-left:26px; margin:2px 0; }
  #dv-content ul.md-check > li::before {
    content:''; position:absolute; left:0; top:3px; width:16px; height:16px;
    border:1.6px solid var(--pink-deep); border-radius:5px; background:#fff;
  }
  #dv-content ul.md-check > li.done::before { background:var(--pink-deep); }
  #dv-content ul.md-check > li.done { color:var(--ink-soft); text-decoration:line-through; }
  #dv-content .link { color:var(--pink-deep); text-decoration:underline; word-break:break-all; }
  .editing #dv-title, .editing #dv-content {
    background:#fff; border-radius:10px; padding:10px; box-shadow:inset 0 0 0 1px var(--line);
  }
  .dv-tags { margin-top:22px; padding-top:10px; border-top:1px solid var(--line); }

  /* ── 인덱스 드로어 ── */
  .scrim { position:fixed; inset:0; z-index:34; background:rgba(70,60,68,0.28); }
  .drawer {
    position:fixed; top:0; left:0; bottom:0; z-index:35; width:80%; max-width:320px;
    background:var(--bg); box-shadow:2px 0 18px rgba(120,100,115,0.25);
    transform:translateX(-100%); transition:transform 0.22s ease; overflow-y:auto;
    -webkit-overflow-scrolling:touch; padding-top:env(safe-area-inset-top);
  }
  .drawer.open { transform:translateX(0); }
  .drawer-head { background:var(--titlebar); color:#fff; padding:14px 16px; font-weight:700; font-size:15px;
    display:flex; align-items:center; gap:8px; }
  .drawer-list { padding:8px 6px 30px; }
  .dw-folder { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-soft);
    font-weight:700; margin:14px 10px 5px; }
  .dw-folder .ic { width:18px; height:18px; color:var(--pink-deep); }
  .dw-fname { flex:1; word-break:break-word; }
  .dw-eye { border:none; background:transparent; color:var(--ink-soft); padding:2px 4px;
    display:inline-flex; align-items:center; }
  .dw-eye .ic { width:18px; height:18px; }
  .dw-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px; }
  .dw-item:active { background:var(--pink-soft); }
  .dw-item .dw-ic { color:var(--pink-deep); flex-shrink:0; }
  .dw-item .dw-ic .ic { width:17px; height:17px; }
  .dw-item .t { font-size:14px; flex:1; word-break:break-word; }

  /* ── 컨텍스트 메뉴 ── */
  .ctx-menu {
    position:fixed; z-index:50; background:#fff; border-radius:12px; min-width:170px;
    box-shadow:0 8px 26px rgba(110,90,105,0.28); overflow:hidden; padding:5px;
  }
  .ctx-item {
    display:block; width:100%; border:none; background:transparent; text-align:left;
    padding:11px 12px; font-size:14px; color:var(--ink); border-radius:8px;
  }
  .ctx-item:active { background:var(--pink-soft); }
  .ctx-item.danger { color:#c66; }
  .ctx-colors { display:flex; gap:7px; padding:9px 10px; }
  .ctx-sw { width:26px; height:26px; border-radius:50%; border:2px solid; padding:0; }

  /* ── 로그인/설정 ── */
  .auth { max-width:400px; margin:0 auto; padding:46px 24px; }
  .auth h1 { font-size:20px; color:var(--pink-deep); margin-bottom:6px; display:flex; align-items:center; gap:7px; }
  .auth p { font-size:13px; color:var(--ink-soft); line-height:1.6; margin-bottom:18px; }
  .auth input, .auth textarea {
    width:100%; border:1px solid var(--line); border-radius:10px; background:#fff;
    padding:12px; font-size:14px; margin-bottom:10px; outline:none; font-family:inherit;
  }
  .auth textarea { height:88px; resize:none; }
  .auth button {
    width:100%; border:none; border-radius:10px; padding:13px; font-size:15px; font-weight:700;
    background:var(--pink-deep); color:#fff; margin-top:4px;
  }
  .auth .ghost { background:transparent; color:var(--ink-soft); font-weight:400; font-size:13px; }
  .err { color:#c66; font-size:13px; margin-top:10px; white-space:pre-wrap; }

  .fab {
    position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom)); z-index:20;
    width:52px; height:52px; border:none; border-radius:50%; background:var(--pink-deep);
    color:#fff; font-size:26px; box-shadow:0 4px 14px rgba(170,140,155,0.4);
  }
  .fab.raised { bottom:calc(72px + env(safe-area-inset-bottom)); }
  .toast {
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(80px + env(safe-area-inset-bottom));
    background:rgba(85,80,85,0.92); color:#fff; font-size:13px; border-radius:20px;
    padding:8px 16px; z-index:60; opacity:0; transition:opacity 0.25s; pointer-events:none;
  }
  .toast.on { opacity:1; }
</style>
</head>
<body>

<!-- 1) 최초 설정: Supabase 연결 정보 -->
<div id="pane-config" class="auth hidden">
  <h1 class="brand">Memo Todo</h1>
  <p>처음 한 번만 PC 앱에 넣었던 <b>config.json</b>과 같은 값을 넣어주세요.</p>
  <input id="cf-url" placeholder="supabaseUrl (https://xxxx.supabase.co)" autocapitalize="off" autocorrect="off" />
  <textarea id="cf-key" placeholder="supabaseAnonKey (anon public 키 전체)" autocapitalize="off" autocorrect="off"></textarea>
  <button id="cf-save">저장하고 시작</button>
  <p class="err" id="cf-err"></p>
</div>

<!-- 2) 로그인 -->
<div id="pane-login" class="auth hidden">
  <h1 class="brand">Memo Todo</h1>
  <p>PC 앱에서 쓰는 동기화 계정으로 로그인하세요.</p>
  <input id="lg-email" type="email" placeholder="이메일" autocapitalize="off" />
  <input id="lg-pw" type="password" placeholder="비밀번호" />
  <button id="lg-btn">로그인</button>
  <button class="ghost" id="lg-reset">연결 정보 다시 입력</button>
  <p class="err" id="lg-err"></p>
</div>

<!-- 3) 메인 -->
<div id="pane-main" class="hidden">
  <div class="top">
    <b>Memo Todo</b><span class="sp"></span>
    <button id="bt-theme" title="테마 색상"></button>
    <button id="bt-refresh" title="새로고침">↻</button>
    <button id="bt-logout" title="로그아웃">⎋</button>
  </div>
  <div class="tabs">
    <button id="tab-todo" class="on">투두 리스트</button>
    <button id="tab-memo">메모</button>
  </div>
  <div class="wrap">
    <div id="list-todo"></div>
    <div id="memo-view" class="hidden">
      <div class="search-bar"><span class="search-ic" id="search-ic"></span><input id="memo-search" placeholder="검색" autocapitalize="off" /><button class="search-clear hidden" id="search-clear"></button></div>
      <div id="list-memo"></div>
    </div>
  </div>
  <button class="fab" id="bt-add">＋</button>
  <div id="tag-bar" class="tag-bar hidden"></div>
</div>

<!-- 4) 메모 상세/편집 -->
<div id="sheet" class="sheet hidden">
  <div class="top">
    <button id="dv-back">‹</button><span class="sp"></span>
    <button id="dv-edit">편집</button>
    <button id="dv-save" class="save hidden">저장</button>
  </div>
  <div class="sheet-body" id="sheet-body">
    <div id="dv-title"></div>
    <div id="dv-content"></div>
    <div class="dv-tags m-tags" id="dv-tags"></div>
  </div>
</div>

<!-- 5) 인덱스 드로어 (왼쪽 밖→안 슬라이드로만 열림) -->
<div id="drawer" class="drawer">
  <div class="drawer-head" id="drawer-head">목차</div>
  <div class="drawer-list" id="drawer-list"></div>
</div>

<!-- 6) 예쁜 달력 모달 -->
<div id="cal-overlay" class="cal-overlay">
  <div class="cal">
    <div class="cal-top">
      <button class="cal-nav" id="cal-prev">‹</button>
      <div class="cal-title" id="cal-title"></div>
      <button class="cal-nav" id="cal-next">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-foot">
      <button class="cal-cancel" id="cal-cancel">취소</button>
      <button class="cal-ok" id="cal-ok">확인</button>

/* ── 데이터 pull/push (PC의 sync.js와 동일 규약) ── */
async function pull() {
  const { data, error } = await client.from('app_state')
    .select('data, updated_at').eq('user_id', user.id).maybeSingle();
  if (error) throw error;
  if (data) { state = data.data; remoteTs = new Date(data.updated_at).getTime(); }
  else state = { todos: [], memos: [], folders: [], ddays: [], settings: {} };
}
function schedulePush() {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async () => {
    try {
      const now = new Date();
      const { error } = await client.from('app_state').upsert({
        user_id: user.id, data: state, updated_at: now.toISOString()
      });
      if (error) throw error;
      lastPushedAt = now.getTime();
      toast('저장됨');
    } catch (e) { toast('저장 실패: ' + (e.message || e)); }
  }, 700);
}
function subscribe() {
  client.channel('app_state_' + user.id)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'app_state', filter: 'user_id=eq.' + user.id },
      (payload) => {
        const row = payload.new;
        if (!row || !row.updated_at) return;
        const ts = new Date(row.updated_at).getTime();
        if (Math.abs(ts - lastPushedAt) < 1500) return; // 내가 올린 변경 에코 무시
        if (editing) return;                             // 편집 중엔 덮어쓰지 않음
        state = row.data; remoteTs = ts;
        renderAll(); if (curMemoId) openMemo(curMemoId, false);
        toast('다른 기기 변경 반영됨');
      })
    .subscribe();
}

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

const cidx = (m) => { const g = String(m && m.color || '').match(/\d/); return g ? g[0] : '0'; };

// PC 본 창과 같은 나열 순서: 고정 → 폴더순 → 루즈
function memosInOrder() {
  const folders = state.folders || [], memos = state.memos || [];
  const inFolder = (m) => m.folderId && folders.some((f) => f.id === m.folderId);
  const pinned = memos.filter((m) => m.pinned).sort((a, b) => (a.pinnedAt || 0) - (b.pinnedAt || 0));
  const out = pinned.map((m) => ({ m, label: null }));
  folders.forEach((f) => memos.filter((m) => m.folderId === f.id && !m.pinned)
    .forEach((m) => out.push({ m, label: f.name || '폴더' })));
  memos.filter((m) => !m.pinned && !inFolder(m)).forEach((m) => out.push({ m, label: null }));
  return out;
}
const folderOf = (m) => (state.folders || []).find((f) => f.id === m.folderId) || null;
const hiddenFolder = (m) => { const f = folderOf(m); return !!(f && f.collapsed); };
// 목차(인덱스)용 순서: 고정 메모를 위로 끌어올리지 않고, 폴더 순서대로 그대로
function memosInFolderOrder() {
  const folders = state.folders || [], memos = state.memos || [];
  const inFolder = (m) => m.folderId && folders.some((f) => f.id === m.folderId);
  const out = [];
  folders.forEach((f) => memos.filter((m) => m.folderId === f.id)
    .forEach((m) => out.push({ m, label: f.name || '폴더' })));
  memos.filter((m) => !inFolder(m)).forEach((m) => out.push({ m, label: null }));
  return out;
}

/* ── 롱프레스 헬퍼 (터치 꾹 누르기 + 데스크톱 우클릭 폴백) ── */
function addLongPress(el, fn, ms) {
  ms = ms || 440;
  let timer = null, sx = 0, sy = 0;
  const clear = () => { if (timer) { clearTimeout(timer); timer = null; } };
  el.addEventListener('touchstart', (e) => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    clear(); timer = setTimeout(() => { timer = null; fn(sx, sy); }, ms);
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) clear();
  }, { passive: true });
  el.addEventListener('touchend', clear);
  el.addEventListener('touchcancel', clear);
  el.addEventListener('contextmenu', (e) => { e.preventDefault(); fn(e.clientX || sx, e.clientY || sy); });
}

/* ── 컨텍스트 메뉴 ──
 * 바깥 닫기는 전용 스크림으로 처리한다. (예전 document click once 방식은
 * 항목 선택 시 stopPropagation 때문에 리스너가 남아 '다음 탭'을 먹어버리는
 * 버그가 있었음 — 테마 변경 후 아이콘이 한 번에 안 눌리던 원인) */
function closeMenu() {
  const m = $('ctx-menu'); if (m) m.remove();
  const s = $('ctx-scrim'); if (s) s.remove();
}
function placeMenu(menu, x, y) {
  const scrim = document.createElement('div'); scrim.id = 'ctx-scrim';
  scrim.style.cssText = 'position:fixed;inset:0;z-index:49;background:transparent;';
  scrim.addEventListener('click', closeMenu);
  document.body.appendChild(scrim);
  document.body.appendChild(menu);
  const mw = menu.offsetWidth || 180, mh = menu.offsetHeight || 160;
  menu.style.left = Math.max(8, Math.min(x, window.innerWidth - mw - 8)) + 'px';
  menu.style.top = Math.max(8, Math.min(y, window.innerHeight - mh - 8)) + 'px';
}
function openMenu(x, y, rows) {
  closeMenu();
  const menu = document.createElement('div'); menu.className = 'ctx-menu'; menu.id = 'ctx-menu';
  rows.forEach((r) => {
    if (r.colors) {
      const cw = document.createElement('div'); cw.className = 'ctx-colors';
      for (let i = 0; i < 6; i++) {
        const sw = document.createElement('button');
        sw.className = 'ctx-sw'; sw.style.background = 'var(--c' + i + ')'; sw.style.borderColor = 'var(--a' + i + ')';
        sw.addEventListener('click', ((idx) => () => { r.onpick(idx); closeMenu(); })(i));
        cw.appendChild(sw);
      }
      menu.appendChild(cw);
    } else {
      const b = document.createElement('button');
      b.className = 'ctx-item' + (r.danger ? ' danger' : ''); b.textContent = r.label;
      b.addEventListener('click', () => { r.onclick(); closeMenu(); });
      menu.appendChild(b);
    }
  });
  placeMenu(menu, x, y);
}
function themeMenu(x, y) {
  closeMenu();
  const menu = document.createElement('div'); menu.className = 'ctx-menu'; menu.id = 'ctx-menu';
  Object.keys(THEMES).forEach((key) => {
    const b = document.createElement('button'); b.className = 'ctx-item';
    const dot = document.createElement('span');
    dot.style.cssText = 'display:inline-block;width:16px;height:16px;border-radius:50%;margin-right:9px;vertical-align:-3px;background:' + THEMES[key].deep;
    b.appendChild(dot); b.appendChild(document.createTextNode(THEMES[key].name));
    b.addEventListener('click', () => { saveTheme(key); closeMenu(); toast('테마: ' + THEMES[key].name); });
    menu.appendChild(b);
  });
  placeMenu(menu, x, y);
}
$('bt-theme').addEventListener('click', (e) => themeMenu(e.clientX || window.innerWidth - 90, (e.clientY || 40) + 8));

/* 블럭(투두/메모) 공통 메뉴: 상단 고정 / 색상 / 삭제 */

/* ── D-DAY ── */
function ddayDiff(date) {
  if (!date) return null;
  const t = new Date(date + 'T00:00:00'); if (isNaN(t.getTime())) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((t - today) / 86400000);
}
function ddayLabel(date) {
  const d = ddayDiff(date);
  if (d === null) return 'D-DAY';
  if (d > 0) return 'D-' + d;
  if (d === 0) return 'D-DAY';
  return 'D+' + (-d);
}
function ddayCls(date) { const d = ddayDiff(date); if (d === 0) return ' today'; if (d < 0) return ' past'; return ''; }
function pruneDdays() {
  if (!Array.isArray(state.ddays)) { state.ddays = []; return false; }
  const before = state.ddays.length;
  state.ddays = state.ddays.filter((d) => { const x = ddayDiff(d.date); return x === null || x >= 0; });
  return state.ddays.length !== before;
}
function todayIso() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

/* 커스텀 달력 모달 */
let calCb = null, calY = 0, calM = 0, calSel = '';
const isoOf = (y, m, d) => y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
function pickDate(initial, cb) {
  calCb = cb; calSel = initial || '';
  const base = initial ? new Date(initial + 'T00:00:00') : new Date();
  const d = isNaN(base.getTime()) ? new Date() : base;
  calY = d.getFullYear(); calM = d.getMonth();
  renderCalendar();
  $('cal-overlay').classList.add('open');
}
function renderCalendar() {
  $('cal-title').textContent = calY + '년 ' + (calM + 1) + '월';
  const grid = $('cal-grid'); grid.innerHTML = '';
  ['일', '월', '화', '수', '목', '금', '토'].forEach((w) => {
    const c = document.createElement('div'); c.className = 'cal-dow'; c.textContent = w; grid.appendChild(c);
  });
  const first = new Date(calY, calM, 1).getDay();
  const days = new Date(calY, calM + 1, 0).getDate();
  const prevDays = new Date(calY, calM, 0).getDate();
  const tIso = todayIso();
  for (let i = 0; i < 42; i++) {
    const cell = document.createElement('button'); cell.className = 'cal-day';
    let y = calY, m = calM, day;
    if (i < first) { m = calM - 1; day = prevDays - first + 1 + i; cell.classList.add('other'); }
    else if (i >= first + days) { m = calM + 1; day = i - first - days + 1; cell.classList.add('other'); }
    else day = i - first + 1;
    const dt = new Date(y, m, day); const iso = isoOf(dt.getFullYear(), dt.getMonth(), dt.getDate());
    cell.textContent = day;
    if (iso === tIso) cell.classList.add('today');
    if (iso === calSel) cell.classList.add('sel');
    cell.addEventListener('click', () => { calSel = iso; renderCalendar(); });
    grid.appendChild(cell);
    if (i >= first + days && day > 7) break;
  }
}
$('cal-prev').addEventListener('click', () => { calM--; if (calM < 0) { calM = 11; calY--; } renderCalendar(); });
$('cal-next').addEventListener('click', () => { calM++; if (calM > 11) { calM = 0; calY++; } renderCalendar(); });
$('cal-cancel').addEventListener('click', () => { $('cal-overlay').classList.remove('open'); calCb = null; });
$('cal-overlay').addEventListener('click', (e) => { if (e.target === $('cal-overlay')) { $('cal-overlay').classList.remove('open'); calCb = null; } });

});

function buildDday() {
  const block = document.createElement('div'); block.className = 'dday-block';
  const head = document.createElement('div'); head.className = 'dday-head';
  const b = document.createElement('b'); b.textContent = 'D-DAY';
  const add = document.createElement('button'); add.className = 'dday-add'; add.innerHTML = svg('plus'); add.title = '디데이 추가';
  add.addEventListener('click', () => {

/* ── 투두 렌더 ── */

/* 세부항목별 분절 진행도 게이지: 칸마다 나뉘어 있고, 칸을 탭하면 그만큼 채워짐.
 * 다 채우면 진행도 자체가 사라짐(세부항목은 유지) — PC 앱과 동일. */
function buildItemProgress(item) {
  const wrap = document.createElement('div'); wrap.className = 'item-prog';
  const boxes = document.createElement('div'); boxes.className = 'pboxes';
  const total = item.progress.total;
  boxes.style.gridTemplateColumns = 'repeat(' + total + ', 1fr)';
  for (let i = 0; i < total; i++) {
    const seg = document.createElement('span');
    seg.className = 'pseg' + (i < item.progress.done ? ' filled' : '');
    seg.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!item.progress) return;
      item.progress.done = (i + 1 === item.progress.done) ? i : i + 1;
      if (item.progress.done >= total) item.progress = null; // 다 채우면 게이지 제거
      schedulePush(); renderTodos();
    });
    boxes.appendChild(seg);
  }
  wrap.appendChild(boxes);
  return wrap;
}

/* 세부항목 제스처:
 *  - 왼쪽으로 슬라이드 → 진행도추가/삭제 액션 노출 (메일 앱처럼)
 *  - 길게 눌러 잡은 채 위아래로 움직이면 → 순서 변경 */
function setupItemGesture(itemEl, rowEl, inner, card, todo) {

  const itemEls = () => [...card.querySelectorAll('.item')];
  rowEl.addEventListener('touchstart', (e) => {
    const t = e.touches[0]; sy = t.clientY; sx = t.clientX; armed = false; mode = null;
    clear(); timer = setTimeout(() => { timer = null; armed = true; itemEl.classList.add('dragging'); }, 420);
  }, { passive: true });
  rowEl.addEventListener('touchmove', (e) => {
    const t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (mode === null) {
      if (armed) { mode = 'drag'; clear(); }
      else if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
        clear();
        if (Math.abs(dx) > Math.abs(dy)) { mode = 'swipe'; inner.style.transition = 'none'; }
        else { mode = 'scroll'; itemEl.classList.remove('dragging'); }
      }
    }
    if (mode === 'drag') {
      e.preventDefault();
      const y = t.clientY, els = itemEls(), i = els.indexOf(itemEl);
      for (let j = 0; j < els.length; j++) {
        if (els[j] === itemEl) continue;
        const b = els[j].getBoundingClientRect();
        if (y > b.top && y < b.bottom) {
          if (j < i) card.insertBefore(itemEl, els[j]);
          else card.insertBefore(itemEl, els[j].nextSibling);
          break;
        }
      }
    } else if (mode === 'swipe') {
      e.preventDefault();
      const tx = Math.max(-104, Math.min(0, dx));
      inner.style.transform = 'translateX(' + tx + 'px)';
      rowEl.classList.toggle('revealed', dx < -40);
    }

  rowEl.addEventListener('touchend', (e) => {
    clear();
    if (mode === 'drag') {
      itemEl.classList.remove('dragging');
      const order = itemEls().map((el) => el.dataset.id);
      todo.items = order.map((id) => (todo.items || []).find((it) => it.id === id)).filter(Boolean);
      schedulePush(); renderTodos(); return;
    }
    if (mode === 'swipe') {
      inner.style.transition = '';
      const dx = (e.changedTouches && e.changedTouches[0].clientX - sx) || 0;
      if (dx < -40) { rowEl.classList.add('revealed'); inner.style.transform = 'translateX(-100px)'; }
      else { rowEl.classList.remove('revealed'); inner.style.transform = ''; }
      return;
    }
    itemEl.classList.remove('dragging');
  });
  rowEl.addEventListener('touchcancel', () => {
    clear(); itemEl.classList.remove('dragging');
    if (mode === 'swipe' && !rowEl.classList.contains('revealed')) { inner.style.transition = ''; inner.style.transform = ''; }
  });
}
// 편집영역 밖을 탭하면 (1) 열려있던 스와이프 액션 닫기 (2) 남은 텍스트 선택범위 해제

/* 메모 카드 스와이프: 왼쪽 → 색상/삭제 노출, 오른쪽 → 상단 고정 토글 */
function setupMemoSwipe(card, inner, m) {
  let sx = 0, sy = 0, mode = null;
  card.addEventListener('touchstart', (e) => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY; mode = null; inner.style.transition = 'none';
  }, { passive: true });
  card.addEventListener('touchmove', (e) => {
    const t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (mode === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) mode = Math.abs(dx) > Math.abs(dy) ? 'h' : 'v';
    if (mode === 'h') {
      e.preventDefault();
      const base = card.classList.contains('revealed') ? -112 : 0;
      inner.style.transform = 'translateX(' + Math.max(-124, Math.min(78, base + dx)) + 'px)';
    }
  });
  card.addEventListener('touchend', (e) => {
    inner.style.transition = '';
    if (mode !== 'h') return;
    card._swiped = true;
    const dx = (e.changedTouches && e.changedTouches[0].clientX - sx) || 0;
    const wasRevealed = card.classList.contains('revealed');
    if (!wasRevealed && dx > 50) { // 오른쪽 스와이프 → 상단 고정
      inner.style.transform = ''; card.classList.remove('revealed');
      m.pinned = !m.pinned; m.pinnedAt = m.pinned ? Date.now() : 0; schedulePush(); renderAll();
      toast(m.pinned ? '상단 고정' : '고정 해제'); return;
    }
    const total = (wasRevealed ? -112 : 0) + dx;
    if (total < -50) { card.classList.add('revealed'); inner.style.transform = 'translateX(-112px)'; }
    else { card.classList.remove('revealed'); inner.style.transform = ''; }

}
function allTags() {

// 왼쪽 경계 밖→안 슬라이드 → 드로어 열기 / 열려 있을 땐 화면 어디서든 오른→왼 슬라이드 → 닫기
(function () {
  let edge = null, dwx = null, dwy = null;
  document.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    if ($('drawer').classList.contains('open')) { dwx = t.clientX; dwy = t.clientY; edge = null; return; }
    dwx = null;
    if ($('pane-main').classList.contains('hidden')) { edge = null; return; }
    if (!$('sheet').classList.contains('hidden')) { edge = null; return; }
    if (curTab !== 'memo') { edge = null; return; } // 목차는 메모 탭에서만 슬라이드로 열림
    edge = (t.clientX < 24) ? { x: t.clientX, y: t.clientY } : null;
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (dwx !== null) { // 드로어 열림 상태 — 좌로 밀면 닫기
      if (dwx - t.clientX > 45 && Math.abs(t.clientY - dwy) < 60) { closeDrawer(); dwx = null; }
      return;
    }
    if (!edge) return;
    if (t.clientX - edge.x > 48 && Math.abs(t.clientY - edge.y) < 45) { openDrawer(); edge = null; }
  }, { passive: true });
  document.addEventListener('touchend', () => { edge = null; dwx = null; });
})();

  $('dv-content').setAttribute('contenteditable', on ? 'true' : 'false');
  $('dv-edit').classList.toggle('hidden', on);
  $('dv-save').classList.toggle('hidden', !on);
}
$('dv-back').addEventListener('click', () => {
  if (editing) saveMemo();
  $('sheet').classList.add('hidden'); curMemoId = null;
});
$('dv-edit').addEventListener('click', () => setEditing(true));
$('dv-save').addEventListener('click', () => { saveMemo(); setEditing(false); });
function saveMemo() {
  const m = (state.memos || []).find((x) => x.id === curMemoId);
  if (!m) return;
  m.title = $('dv-title').innerHTML;
  m.content = $('dv-content').innerHTML;
  m.updatedAt = Date.now();
  schedulePush(); renderMemos(); renderDrawer();
}
// 보기 모드에서 체크리스트(li) 탭 → 완료 토글 / 링크 탭 → 새 탭
$('dv-content').addEventListener('click', (e) => {
  if (editing) return;
  const a = e.target.closest && e.target.closest('.link');
  if (a) { window.open(a.dataset.href || a.textContent.trim(), '_blank'); return; }
  const li = e.target.closest && e.target.closest('ul.md-check > li');
  if (li) {
    li.classList.toggle('done');
    const m = (state.memos || []).find((x) => x.id === curMemoId);
    if (m) { m.content = $('dv-content').innerHTML; m.updatedAt = Date.now(); schedulePush(); renderMemos(); }
  }
});
// 글머리: 줄 맨 앞에 -, *, 숫자., ㅁ 입력 후 스페이스 → 목록/체크리스트로 변환
$('dv-content').addEventListener('beforeinput', (e) => {
  if (!editing) return;
  if (e.inputType === 'insertText' && e.data === ' ') {
    if (tryMakeList()) e.preventDefault();
  }
});
function tryMakeList() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return false;
  const range = sel.getRangeAt(0);
  if (!range.collapsed) return false;
  const node = range.startContainer;
  if (node.nodeType !== 3) return false;
  const before = node.textContent.slice(0, range.startOffset);
  let type = null;
  if (before === '-' || before === '*' || before === '•') type = 'ul';
  else if (before === 'ㅁ' || before === '[]') type = 'check';
  else if (/^\d+\.$/.test(before)) type = 'ol';
  if (!type) return false;
  // 마커 글자 선택 후 삭제
  const del = document.createRange();
  del.setStart(node, 0); del.setEnd(node, range.startOffset);
  sel.removeAllRanges(); sel.addRange(del);
  document.execCommand('delete');
  if (type === 'ol') document.execCommand('insertOrderedList');
  else document.execCommand('insertUnorderedList');
  if (type === 'check') {
    const a = window.getSelection().anchorNode;
    const host = a && (a.nodeType === 3 ? a.parentElement : a);
    const ul = host && host.closest && host.closest('ul');
    if (ul) ul.classList.add('md-check');
  }
  return true;
}

/* ── 탭/추가/새로고침 ── */
function setTab(t) {
  curTab = t;
  $('tab-todo').classList.toggle('on', t === 'todo');
  $('tab-memo').classList.toggle('on', t === 'memo');
  $('list-todo').classList.toggle('hidden', t !== 'todo');
  $('memo-view').classList.toggle('hidden', t !== 'memo');
  renderTagBar();
}
$('tab-todo').addEventListener('click', () => setTab('todo'));
$('tab-memo').addEventListener('click', () => setTab('memo'));
$('bt-add').addEventListener('click', () => {
  if (curTab === 'todo') {
    (state.todos = state.todos || []).push({ id: uid(), title: '', color: 'var(--c0)', pinned: false, items: [{ id: uid(), text: '', done: false }] });
    schedulePush(); renderTodos();
  } else {
    const m = { id: uid(), title: '', content: '', tags: [], color: 'var(--c0)', folderId: null,
      pinned: false, pinnedAt: 0, createdAt: Date.now(), updatedAt: Date.now() };
    (state.memos = state.memos || []).push(m);
    schedulePush(); renderMemos(); renderDrawer(); openMemo(m.id, true); setEditing(true);
  }
});
$('bt-refresh').addEventListener('click', async () => {
  try { await pull(); renderAll(); toast('새로고침'); } catch (e) { toast('불러오기 실패'); }
});
document.addEventListener('visibilitychange', async () => {
  // 앱으로 돌아올 때 자동 새로고침(편집 중이면 보류)
  if (document.visibilityState === 'visible' && user && !editing) {
    try { await pull(); renderAll(); } catch (_) {}
  }
});

/* ── 시작 ── */
async function start() {
  await pull();
  renderAll(); setTab('todo');
  show('pane-main');
  subscribe();
}
paintIcons();
(async function init() {
  const cfg = getConfig();
  if (!cfg) { show('pane-config'); return; }
  client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  const { data } = await client.auth.getUser().catch(() => ({ data: null }));
  user = data && data.user;
  if (!user) { show('pane-login'); return; }
  try { await start(); } catch (e) {
    show('pane-login'); $('lg-err').textContent = '불러오기 실패: ' + (e.message || e);
  }
})();
</script>
</body>

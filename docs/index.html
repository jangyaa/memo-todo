<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Memo Todo</title>
<!-- 아이폰 '홈 화면에 추가' 시 앱처럼 열리게 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Memo Todo" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
  :root {
    --bg:#faf8f9; --ink:#555055; --ink-soft:#9e989d; --line:#f0eaed;
    --pink:#edd9e0; --pink-deep:#cdb0bb; --pink-soft:#f7f2f4;
    --titlebar:linear-gradient(180deg,#cdb6c0,#c4abb6);
    --c0:#f8f1f4; --c1:#f4f0f7; --c2:#eff5ef; --c3:#eff4f9; --c4:#f8f3ec; --c5:#f8f1f1;
    --a0:#d3a9b6; --a1:#b3a6cd; --a2:#a1c2a1; --a3:#a0bace; --a4:#cfba93; --a5:#d3a9a9;
  }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:'Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px;
    padding-top:env(safe-area-inset-top);
  }
  .hidden { display:none !important; }

  /* ── 상단바 ── */
  .top {
    position:sticky; top:0; z-index:10; background:var(--titlebar); color:#fff;
    display:flex; align-items:center; gap:6px; padding:10px 12px;
    padding-top:calc(10px + env(safe-area-inset-top)); margin-top:calc(-1 * env(safe-area-inset-top));
  }
  .top b { font-size:16px; letter-spacing:-0.01em; }
  .top .sp { flex:1; }
  .top button {
    border:none; background:rgba(255,255,255,0.18); color:#fff; border-radius:9px;
    min-width:34px; height:32px; font-size:15px; padding:0 9px;
  }
  .tabs { display:flex; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:52px; z-index:9; }
  .tabs button {
    flex:1; border:none; background:transparent; padding:11px 0; font-size:14px; font-weight:700;
    color:var(--ink-soft); border-bottom:2px solid transparent;
  }
  .tabs button.on { color:var(--pink-deep); border-bottom-color:var(--pink-deep); }

  .wrap { padding:12px 12px 90px; max-width:560px; margin:0 auto; }

  /* ── 카드 공통 ── */
  .card {
    background:#fff; border-radius:14px; padding:14px 14px 12px; margin-bottom:12px;
    box-shadow:0 2px 8px rgba(180,150,165,0.12); position:relative;
  }
  .card.dim { opacity:0.55; }
  .card h3 { font-size:15px; margin-bottom:8px; word-break:break-word; }
  .pin { color:var(--pink-deep); font-size:12px; margin-right:4px; }

  /* ── 투두 ── */
  .item { display:flex; align-items:flex-start; gap:9px; padding:6px 0; position:relative; }
  .item.dragging { background:var(--pink-soft); border-radius:8px; }
  .item input[type=checkbox] {
    width:19px; height:19px; margin-top:1px; accent-color:var(--pink-deep); flex-shrink:0;
  }
  .item .txt { flex:1; border:none; background:transparent; font-size:14px; color:var(--ink);
    outline:none; word-break:break-word; min-height:20px; }
  .item.done .txt { color:var(--ink-soft); text-decoration:line-through; }
  .item-x {
    display:none; flex-shrink:0; width:22px; height:22px; border:none; border-radius:50%;
    background:#e5b7b7; color:#fff; font-size:13px; line-height:22px; padding:0; margin-top:0;
  }
  .item.armed { background:var(--pink-soft); border-radius:8px; }
  .item.armed .item-x { display:block; }
  /* 진행도 바 */
  .prog-wrap { display:flex; align-items:center; gap:8px; margin:8px 2px 2px; }
  .prog-bar { flex:1; height:7px; border-radius:4px; background:var(--line); overflow:hidden; }
  .prog-fill { height:100%; background:var(--pink-deep); border-radius:4px; transition:width 0.25s; }
  .prog-num { font-size:11px; color:var(--ink-soft); flex-shrink:0; min-width:30px; text-align:right; }
  /* 세부항목 추가 라인 */
  .add-line {
    display:block; width:100%; border:none; background:transparent; color:var(--pink-deep);
    font-size:20px; font-weight:700; padding:8px 0 2px; margin-top:4px;
    border-top:1px dashed var(--line); text-align:center; line-height:1;
  }

  /* ── 메모 목록 ── */
  .search-bar {
    position:sticky; top:88px; z-index:8; background:var(--bg); padding:2px 0 10px;
  }
  .search-bar input {
    width:100%; border:1px solid var(--line); border-radius:20px; background:#fff;
    padding:9px 14px; font-size:14px; outline:none; font-family:inherit;
  }
  .memo-row { display:flex; align-items:center; gap:10px; }
  .memo-row .sq { width:14px; height:14px; border-radius:5px; flex-shrink:0; }
  .memo-row .m-title { font-weight:700; font-size:14px; flex:1; word-break:break-word; }
  .memo-prev { font-size:12.5px; color:var(--ink-soft); margin-top:6px;
    overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .m-tags { margin-top:8px; display:flex; flex-wrap:wrap; gap:5px; }
  .m-tags span { font-size:11px; color:var(--ink-soft); background:var(--pink-soft);
    border-radius:20px; padding:2px 9px; }

  /* ── 하단 해시태그 필터 바 ── */
  .tag-bar {
    position:fixed; left:0; right:0; bottom:0; z-index:15; background:#fff;
    border-top:1px solid var(--line); display:flex; gap:7px; overflow-x:auto;
    padding:9px 12px calc(9px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling:touch;
  }
  .tag-bar::-webkit-scrollbar { display:none; }
  .tag-bar button {
    flex-shrink:0; border:1px solid var(--line); background:var(--pink-soft); color:var(--ink-soft);
    border-radius:20px; padding:6px 13px; font-size:12.5px; white-space:nowrap;
  }
  .tag-bar button.on { background:var(--pink-deep); border-color:var(--pink-deep); color:#fff; }

  /* ── 메모 상세 ── */
  .sheet {
    position:fixed; inset:0; z-index:30; background:var(--bg); overflow-y:auto;
    padding-bottom:70px; -webkit-overflow-scrolling:touch;
  }
  .sheet .top button.save { background:#fff; color:var(--pink-deep); font-weight:700; }
  .sheet-body { max-width:560px; margin:0 auto; padding:16px 16px 40px; }
  #dv-title, #dv-content { outline:none; }
  #dv-title { font-size:20px; font-weight:700; margin-bottom:20px; min-height:28px; word-break:break-word; }
  #dv-title:empty::before { content:'제목'; color:var(--ink-soft); opacity:0.6; }
  #dv-content { font-size:15px; line-height:1.85; min-height:200px; word-break:break-word; white-space:pre-wrap; }
  #dv-content img { max-width:100%; height:auto; border-radius:8px; }
  #dv-content hr { border:none; border-top:1px solid var(--line); margin:8px 0; }
  #dv-content blockquote { margin:4px 0; padding-left:10px; border-left:3px solid var(--line); color:var(--ink-soft); }
  #dv-content ul, #dv-content ol { margin:4px 0; padding-left:22px; }
  #dv-content ul.md-check { list-style:none; padding-left:4px; }
  #dv-content ul.md-check > li { position:relative; padding-left:26px; margin:2px 0; }
  #dv-content ul.md-check > li::before {
    content:''; position:absolute; left:0; top:3px; width:16px; height:16px;
    border:1.6px solid var(--pink-deep); border-radius:5px; background:#fff;
  }
  #dv-content ul.md-check > li.done::before { background:var(--pink-deep); }
  #dv-content ul.md-check > li.done { color:var(--ink-soft); text-decoration:line-through; }
  #dv-content .link { color:var(--pink-deep); text-decoration:underline; word-break:break-all; }
  .editing #dv-title, .editing #dv-content {
    background:#fff; border-radius:10px; padding:10px; box-shadow:inset 0 0 0 1px var(--line);
  }
  .dv-tags { margin-top:22px; padding-top:10px; border-top:1px solid var(--line); }

  /* ── 인덱스 드로어 ── */
  .scrim { position:fixed; inset:0; z-index:34; background:rgba(70,60,68,0.28); }
  .drawer {
    position:fixed; top:0; left:0; bottom:0; z-index:35; width:80%; max-width:320px;
    background:var(--bg); box-shadow:2px 0 18px rgba(120,100,115,0.25);
    transform:translateX(-100%); transition:transform 0.22s ease; overflow-y:auto;
    -webkit-overflow-scrolling:touch; padding-top:env(safe-area-inset-top);
  }
  .drawer.open { transform:translateX(0); }
  .drawer-head { background:var(--titlebar); color:#fff; padding:14px 16px; font-weight:700; font-size:15px; }
  .drawer-list { padding:8px 6px 30px; }
  .dw-folder { font-size:12px; color:var(--ink-soft); font-weight:700; margin:12px 10px 4px; }
  .dw-item { display:flex; align-items:center; gap:9px; padding:10px 12px; border-radius:9px; }
  .dw-item:active { background:var(--pink-soft); }
  .dw-item .sq { width:11px; height:11px; border-radius:4px; flex-shrink:0; }
  .dw-item .t { font-size:14px; flex:1; word-break:break-word; }

  /* ── 컨텍스트 메뉴 ── */
  .ctx-menu {
    position:fixed; z-index:50; background:#fff; border-radius:12px; min-width:170px;
    box-shadow:0 8px 26px rgba(110,90,105,0.28); overflow:hidden; padding:5px;
  }
  .ctx-item {
    display:block; width:100%; border:none; background:transparent; text-align:left;
    padding:11px 12px; font-size:14px; color:var(--ink); border-radius:8px;
  }
  .ctx-item:active { background:var(--pink-soft); }
  .ctx-item.danger { color:#c66; }
  .ctx-colors { display:flex; gap:7px; padding:9px 10px; }
  .ctx-sw { width:26px; height:26px; border-radius:50%; border:2px solid; padding:0; }

  /* ── 로그인/설정 ── */
  .auth { max-width:400px; margin:0 auto; padding:46px 24px; }
  .auth h1 { font-size:20px; color:var(--pink-deep); margin-bottom:6px; }
  .auth p { font-size:13px; color:var(--ink-soft); line-height:1.6; margin-bottom:18px; }
  .auth input, .auth textarea {
    width:100%; border:1px solid var(--line); border-radius:10px; background:#fff;
    padding:12px; font-size:14px; margin-bottom:10px; outline:none; font-family:inherit;
  }
  .auth textarea { height:88px; resize:none; }
  .auth button {
    width:100%; border:none; border-radius:10px; padding:13px; font-size:15px; font-weight:700;
    background:var(--pink-deep); color:#fff; margin-top:4px;
  }
  .auth .ghost { background:transparent; color:var(--ink-soft); font-weight:400; font-size:13px; }
  .err { color:#c66; font-size:13px; margin-top:10px; white-space:pre-wrap; }

  .fab {
    position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom)); z-index:20;
    width:52px; height:52px; border:none; border-radius:50%; background:var(--pink-deep);
    color:#fff; font-size:26px; box-shadow:0 4px 14px rgba(170,140,155,0.4);
  }
  .fab.raised { bottom:calc(72px + env(safe-area-inset-bottom)); }
  .toast {
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(80px + env(safe-area-inset-bottom));
    background:rgba(85,80,85,0.92); color:#fff; font-size:13px; border-radius:20px;
    padding:8px 16px; z-index:60; opacity:0; transition:opacity 0.25s; pointer-events:none;
  }
  .toast.on { opacity:1; }
</style>
</head>
<body>

<!-- 1) 최초 설정: Supabase 연결 정보 -->
<div id="pane-config" class="auth hidden">
  <h1>🤍 Memo Todo</h1>
  <p>처음 한 번만 PC 앱에 넣었던 <b>config.json</b>과 같은 값을 넣어주세요.</p>
  <input id="cf-url" placeholder="supabaseUrl (https://xxxx.supabase.co)" autocapitalize="off" autocorrect="off" />
  <textarea id="cf-key" placeholder="supabaseAnonKey (anon public 키 전체)" autocapitalize="off" autocorrect="off"></textarea>
  <button id="cf-save">저장하고 시작</button>
  <p class="err" id="cf-err"></p>
</div>

<!-- 2) 로그인 -->
<div id="pane-login" class="auth hidden">
  <h1>🤍 Memo Todo</h1>
  <p>PC 앱에서 쓰는 동기화 계정으로 로그인하세요.</p>
  <input id="lg-email" type="email" placeholder="이메일" autocapitalize="off" />
  <input id="lg-pw" type="password" placeholder="비밀번호" />
  <button id="lg-btn">로그인</button>
  <button class="ghost" id="lg-reset">연결 정보 다시 입력</button>
  <p class="err" id="lg-err"></p>
</div>

<!-- 3) 메인 -->
<div id="pane-main" class="hidden">
  <div class="top">
    <button id="bt-menu" title="목차">☰</button>
    <b>Memo Todo</b><span class="sp"></span>
    <button id="bt-theme" title="테마 색상">🎨</button>
    <button id="bt-refresh" title="새로고침">↻</button>
    <button id="bt-logout" title="로그아웃">⎋</button>
  </div>
  <div class="tabs">
    <button id="tab-todo" class="on">투두 리스트</button>
    <button id="tab-memo">메모</button>
  </div>
  <div class="wrap">
    <div id="list-todo"></div>
    <div id="memo-view" class="hidden">
      <div class="search-bar"><input id="memo-search" placeholder="🔍 메모 검색" autocapitalize="off" /></div>
      <div id="list-memo"></div>
    </div>
  </div>
  <button class="fab" id="bt-add">＋</button>
  <div id="tag-bar" class="tag-bar hidden"></div>
</div>

<!-- 4) 메모 상세/편집 -->
<div id="sheet" class="sheet hidden">
  <div class="top">
    <button id="dv-back">‹</button><span class="sp"></span>
    <button id="dv-edit">편집</button>
    <button id="dv-save" class="save hidden">저장</button>
  </div>
  <div class="sheet-body" id="sheet-body">
    <div id="dv-title"></div>
    <div id="dv-content"></div>
    <div class="dv-tags m-tags" id="dv-tags"></div>
  </div>
</div>

<!-- 5) 인덱스 드로어 -->
<div id="drawer" class="drawer">
  <div class="drawer-head">🗂 목차</div>
  <div class="drawer-list" id="drawer-list"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
/* Memo Todo 모바일 웹앱 — PC 앱과 같은 Supabase(app_state 한 행)를 읽고 씀.
 * 마지막 저장이 이기는(last-write-wins) 동일한 동기화 모델.
 * 테마 색상만은 기기별(localStorage 'mt-theme')로 따로 저장돼 PC와 무관하게 동작. */
const $ = (id) => document.getElementById(id);
let client = null, user = null, state = null, remoteTs = 0, lastPushedAt = 0;
let curMemoId = null, editing = false, pushTimer = null;
let curTab = 'todo', memoQuery = '', activeTags = new Set();

/* ── 테마(기기별) ── */
const THEMES = {
  pink:     { name:'핑크',   bg:'#faf8f9', deep:'#cdb0bb', bar:['#cdb6c0','#c4abb6'], soft:'#f7f2f4', pink:'#edd9e0' },
  lavender: { name:'라벤더', bg:'#f9f8fb', deep:'#a99bc9', bar:['#bcb0d6','#b0a3cd'], soft:'#f3f1f7', pink:'#e2dcef' },
  mint:     { name:'민트',   bg:'#f7faf8', deep:'#8ab892', bar:['#a6cbab','#98bf9e'], soft:'#eef5ef', pink:'#d8ecdb' },
  sky:      { name:'하늘',   bg:'#f7f9fb', deep:'#8aabc8', bar:['#a6c3da','#98b8d1'], soft:'#eef3f8', pink:'#d9e6f1' },
  butter:   { name:'버터',   bg:'#fbf9f5', deep:'#c9b183', bar:['#d8c6a1','#cfba93'], soft:'#f8f3ec', pink:'#efe3cd' },
  gray:     { name:'그레이', bg:'#f8f8f9', deep:'#a29aa4', bar:['#b7afb9','#a9a2ab'], soft:'#f2f1f3', pink:'#e3dfe5' }
};
function applyTheme(key) {
  const t = THEMES[key] || THEMES.pink;
  const r = document.documentElement.style;
  r.setProperty('--bg', t.bg);
  r.setProperty('--pink-deep', t.deep);
  r.setProperty('--pink-soft', t.soft);
  r.setProperty('--pink', t.pink);
  r.setProperty('--titlebar', 'linear-gradient(180deg,' + t.bar[0] + ',' + t.bar[1] + ')');
  try {
    const m = document.querySelector('meta[name=theme-color]');
    if (m) m.setAttribute('content', t.bar[0]);
  } catch (_) {}
}
function saveTheme(key) { try { localStorage.setItem('mt-theme', key); } catch (_) {} applyTheme(key); }
applyTheme((function () { try { return localStorage.getItem('mt-theme'); } catch (_) { return null; } })() || 'pink');

/* ── 화면 전환 ── */
function show(pane) {
  ['pane-config', 'pane-login', 'pane-main'].forEach((p) =>
    $(p).classList.toggle('hidden', p !== pane));
}
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1800);
}

/* ── 연결 설정 ── */
function getConfig() {
  try { return JSON.parse(localStorage.getItem('mt-config')); } catch (_) { return null; }
}
$('cf-save').addEventListener('click', () => {
  const url = $('cf-url').value.trim().replace(/\/+$/, '');
  const key = $('cf-key').value.replace(/\s+/g, '');
  if (!/^https:\/\/.+/.test(url) || key.length < 20) {
    $('cf-err').textContent = 'URL 또는 키 형식이 올바르지 않아요.'; return;
  }
  localStorage.setItem('mt-config', JSON.stringify({ supabaseUrl: url, supabaseAnonKey: key }));
  location.reload();
});
$('lg-reset').addEventListener('click', () => {
  localStorage.removeItem('mt-config'); location.reload();
});

/* ── 로그인 ── */
$('lg-btn').addEventListener('click', async () => {
  $('lg-err').textContent = '';
  try {
    const { data, error } = await client.auth.signInWithPassword({
      email: $('lg-email').value.trim(), password: $('lg-pw').value
    });
    if (error) throw error;
    user = data.user;
    await start();
  } catch (e) { $('lg-err').textContent = '로그인 실패: ' + (e.message || e); }
});
$('bt-logout').addEventListener('click', async () => {
  await client.auth.signOut(); location.reload();
});

/* ── 데이터 pull/push (PC의 sync.js와 동일 규약) ── */
async function pull() {
  const { data, error } = await client.from('app_state')
    .select('data, updated_at').eq('user_id', user.id).maybeSingle();
  if (error) throw error;
  if (data) { state = data.data; remoteTs = new Date(data.updated_at).getTime(); }
  else state = { todos: [], memos: [], folders: [], ddays: [], settings: {} };
}
function schedulePush() {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async () => {
    try {
      const now = new Date();
      const { error } = await client.from('app_state').upsert({
        user_id: user.id, data: state, updated_at: now.toISOString()
      });
      if (error) throw error;
      lastPushedAt = now.getTime();
      toast('저장됨 ✓');
    } catch (e) { toast('저장 실패: ' + (e.message || e)); }
  }, 700);
}
function subscribe() {
  client.channel('app_state_' + user.id)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'app_state', filter: 'user_id=eq.' + user.id },
      (payload) => {
        const row = payload.new;
        if (!row || !row.updated_at) return;
        const ts = new Date(row.updated_at).getTime();
        if (Math.abs(ts - lastPushedAt) < 1500) return; // 내가 올린 변경 에코 무시
        if (editing) return;                             // 편집 중엔 덮어쓰지 않음
        state = row.data; remoteTs = ts;
        renderAll(); if (curMemoId) openMemo(curMemoId, false);
        toast('다른 기기 변경 반영됨');
      })
    .subscribe();
}

/* ── 유틸 ── */
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const plain = (html) => { const d = document.createElement('div'); d.innerHTML = html || ''; return d.textContent || ''; };
const cidx = (m) => { const g = String(m && m.color || '').match(/\d/); return g ? g[0] : '0'; };
const accent = (m) => 'var(--a' + cidx(m) + ')';
const blockBg = (m) => 'var(--c' + cidx(m) + ')';
// PC 본 창과 같은 나열 순서: 고정 → 폴더순 → 루즈
function memosInOrder() {
  const folders = state.folders || [], memos = state.memos || [];
  const inFolder = (m) => m.folderId && folders.some((f) => f.id === m.folderId);
  const pinned = memos.filter((m) => m.pinned).sort((a, b) => (a.pinnedAt || 0) - (b.pinnedAt || 0));
  const out = pinned.map((m) => ({ m, label: null }));
  folders.forEach((f) => memos.filter((m) => m.folderId === f.id && !m.pinned)
    .forEach((m) => out.push({ m, label: f.name || '폴더' })));
  memos.filter((m) => !m.pinned && !inFolder(m)).forEach((m) => out.push({ m, label: null }));
  return out;
}

/* ── 롱프레스 헬퍼 (터치 꾹 누르기 + 데스크톱 우클릭 폴백) ── */
function addLongPress(el, fn, ms) {
  ms = ms || 440;
  let timer = null, sx = 0, sy = 0;
  const clear = () => { if (timer) { clearTimeout(timer); timer = null; } };
  el.addEventListener('touchstart', (e) => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    clear(); timer = setTimeout(() => { timer = null; fn(sx, sy); }, ms);
  }, { passive: true });
  el.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (Math.abs(t.clientX - sx) > 10 || Math.abs(t.clientY - sy) > 10) clear();
  }, { passive: true });
  el.addEventListener('touchend', clear);
  el.addEventListener('touchcancel', clear);
  el.addEventListener('contextmenu', (e) => { e.preventDefault(); fn(e.clientX || sx, e.clientY || sy); });
}

/* ── 컨텍스트 메뉴 ── */
function closeMenu() { const m = $('ctx-menu'); if (m) m.remove(); }
function openMenu(x, y, rows) {
  closeMenu();
  const menu = document.createElement('div'); menu.className = 'ctx-menu'; menu.id = 'ctx-menu';
  menu.addEventListener('click', (e) => e.stopPropagation());
  rows.forEach((r) => {
    if (r.colors) {
      const cw = document.createElement('div'); cw.className = 'ctx-colors';
      for (let i = 0; i < 6; i++) {
        const sw = document.createElement('button');
        sw.className = 'ctx-sw'; sw.style.background = 'var(--c' + i + ')'; sw.style.borderColor = 'var(--a' + i + ')';
        sw.addEventListener('click', ((idx) => () => { r.onpick(idx); closeMenu(); })(i));
        cw.appendChild(sw);
      }
      menu.appendChild(cw);
    } else {
      const b = document.createElement('button');
      b.className = 'ctx-item' + (r.danger ? ' danger' : ''); b.textContent = r.label;
      b.addEventListener('click', () => { r.onclick(); closeMenu(); });
      menu.appendChild(b);
    }
  });
  document.body.appendChild(menu);
  const mw = menu.offsetWidth || 180, mh = menu.offsetHeight || 160;
  menu.style.left = Math.max(8, Math.min(x, window.innerWidth - mw - 8)) + 'px';
  menu.style.top = Math.max(8, Math.min(y, window.innerHeight - mh - 8)) + 'px';
  setTimeout(() => document.addEventListener('click', closeMenu, { once: true }), 0);
}
function themeMenu(x, y) {
  closeMenu();
  const menu = document.createElement('div'); menu.className = 'ctx-menu'; menu.id = 'ctx-menu';
  menu.addEventListener('click', (e) => e.stopPropagation());
  Object.keys(THEMES).forEach((key) => {
    const b = document.createElement('button'); b.className = 'ctx-item';
    const dot = document.createElement('span');
    dot.style.cssText = 'display:inline-block;width:16px;height:16px;border-radius:50%;margin-right:9px;vertical-align:-3px;background:' + THEMES[key].deep;
    b.appendChild(dot); b.appendChild(document.createTextNode(THEMES[key].name));
    b.addEventListener('click', () => { saveTheme(key); closeMenu(); toast('테마: ' + THEMES[key].name); });
    menu.appendChild(b);
  });
  document.body.appendChild(menu);
  const mw = menu.offsetWidth || 180, mh = menu.offsetHeight || 240;
  menu.style.left = Math.max(8, Math.min(x, window.innerWidth - mw - 8)) + 'px';
  menu.style.top = Math.max(8, Math.min(y, window.innerHeight - mh - 8)) + 'px';
  setTimeout(() => document.addEventListener('click', closeMenu, { once: true }), 0);
}
$('bt-theme').addEventListener('click', (e) => themeMenu(e.clientX || window.innerWidth - 90, (e.clientY || 40) + 8));

/* 블럭(투두/메모) 공통 메뉴: 상단 고정 / 색상 / 삭제 */
function blockMenuRows(obj, list, afterRender) {
  return [
    { label: obj.pinned ? '상단 고정 해제' : '상단 고정', onclick: () => {
      obj.pinned = !obj.pinned; obj.pinnedAt = obj.pinned ? Date.now() : 0; schedulePush(); afterRender();
    } },
    { colors: true, onpick: (i) => { obj.color = 'var(--c' + i + ')'; schedulePush(); afterRender(); } },
    { label: '삭제', danger: true, onclick: () => {
      const arr = state[list] || [];
      state[list] = arr.filter((x) => x.id !== obj.id);
      if (list === 'memos' && curMemoId === obj.id) { $('sheet').classList.add('hidden'); curMemoId = null; }
      schedulePush(); afterRender();
    } }
  ];
}

/* ── 투두 렌더 ── */
function renderTodos() {
  const root = $('list-todo'); root.innerHTML = '';
  const todos = [
    ...(state.todos || []).filter((t) => t.pinned).sort((a, b) => (a.pinnedAt || 0) - (b.pinnedAt || 0)),
    ...(state.todos || []).filter((t) => !t.pinned)
  ];
  if (!todos.length) { root.innerHTML = '<p style="color:var(--ink-soft);text-align:center;padding:40px 0">할 일이 없어요</p>'; return; }
  todos.forEach((todo) => {
    const card = document.createElement('div');
    card.className = 'card'; card.style.background = blockBg(todo);
    const h = document.createElement('h3');
    if (todo.pinned) h.innerHTML = '<span class="pin">📌</span>';
    h.appendChild(document.createTextNode(todo.title || 'To-do'));
    // 블럭 제목 꾹 누르기 → 상단 고정/색상/삭제
    addLongPress(h, (x, y) => openMenu(x, y, blockMenuRows(todo, 'todos', renderTodos)));
    card.appendChild(h);

    (todo.items || []).forEach((item) => {
      const row = document.createElement('div');
      row.className = 'item' + (item.done ? ' done' : '');
      row.dataset.id = item.id;
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = !!item.done;
      cb.addEventListener('change', () => { item.done = cb.checked; schedulePush(); renderTodos(); });
      const txt = document.createElement('div');
      txt.className = 'txt'; txt.contentEditable = 'true'; txt.textContent = item.text || '';
      txt.addEventListener('blur', () => {
        if (txt.innerText !== (item.text || '')) { item.text = txt.innerText; schedulePush(); }
      });
      const xb = document.createElement('button');
      xb.className = 'item-x'; xb.textContent = '✕';
      xb.addEventListener('click', (e) => {
        e.stopPropagation();
        todo.items = (todo.items || []).filter((it) => it.id !== item.id);
        schedulePush(); renderTodos();
      });
      row.appendChild(cb); row.appendChild(txt); row.appendChild(xb);
      setupItemGesture(row, card, todo);
      card.appendChild(row);
    });

    // 진행도 바
    const items = todo.items || [];
    if (items.length) {
      const done = items.filter((it) => it.done).length;
      const pw = document.createElement('div'); pw.className = 'prog-wrap';
      const bar = document.createElement('div'); bar.className = 'prog-bar';
      const fill = document.createElement('div'); fill.className = 'prog-fill';
      fill.style.width = Math.round(done / items.length * 100) + '%';
      bar.appendChild(fill);
      const num = document.createElement('span'); num.className = 'prog-num'; num.textContent = done + '/' + items.length;
      pw.appendChild(bar); pw.appendChild(num);
      card.appendChild(pw);
    }

    // 중앙 정렬 + 한 줄: 아무 곳이나 탭하면 세부항목 추가
    const add = document.createElement('button');
    add.className = 'add-line'; add.textContent = '＋';
    add.addEventListener('click', () => {
      (todo.items = todo.items || []).push({ id: uid(), text: '', done: false });
      schedulePush(); renderTodos();
    });
    card.appendChild(add);
    root.appendChild(card);
  });
}

/* 세부항목 제스처: 꾹 누르면 X(삭제) 노출, 누른 채 움직이면 순서 변경 */
function setupItemGesture(row, card, todo) {
  let timer = null, sy = 0, sx = 0, armed = false, dragging = false;
  const clear = () => { if (timer) { clearTimeout(timer); timer = null; } };
  const itemRows = () => [...card.querySelectorAll('.item')];
  row.addEventListener('touchstart', (e) => {
    const t = e.touches[0]; sy = t.clientY; sx = t.clientX; dragging = false;
    clear(); timer = setTimeout(() => { timer = null; armed = true; armRow(row); }, 420);
  }, { passive: true });
  row.addEventListener('touchmove', (e) => {
    const t = e.touches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (timer) { if (Math.abs(dx) > 10 || Math.abs(dy) > 10) clear(); return; }
    if (armed && !dragging) { dragging = true; row.classList.add('dragging'); row.classList.remove('armed'); }
    if (dragging) {
      e.preventDefault();
      const y = t.clientY, rs = itemRows(), i = rs.indexOf(row);
      for (let j = 0; j < rs.length; j++) {
        if (rs[j] === row) continue;
        const b = rs[j].getBoundingClientRect();
        if (y > b.top && y < b.bottom) {
          if (j < i) card.insertBefore(row, rs[j]);
          else card.insertBefore(row, rs[j].nextSibling);
          break;
        }
      }
    }
  });
  row.addEventListener('touchend', () => {
    clear();
    if (dragging) {
      dragging = false; armed = false; row.classList.remove('dragging');
      const order = itemRows().map((r) => r.dataset.id);
      todo.items = order.map((id) => (todo.items || []).find((it) => it.id === id)).filter(Boolean);
      schedulePush(); renderTodos();
    }
  });
  row.addEventListener('touchcancel', () => { clear(); if (dragging) { dragging = false; row.classList.remove('dragging'); } });
}
function armRow(row) {
  [...document.querySelectorAll('.item.armed')].forEach((r) => { if (r !== row) r.classList.remove('armed'); });
  row.classList.add('armed');
}
// 다른 곳을 터치하면 X 상태 해제
document.addEventListener('touchstart', (e) => {
  if (!e.target.closest || !e.target.closest('.item.armed')) {
    [...document.querySelectorAll('.item.armed')].forEach((r) => r.classList.remove('armed'));
  }
}, { passive: true });

/* ── 메모 목록(파일명/폴더 라벨 없이) ── */
function filteredMemoRows() {
  let rows = memosInOrder();
  if (memoQuery) {
    const q = memoQuery.toLowerCase();
    rows = rows.filter(({ m }) => (plain(m.title) + ' ' + plain(m.content)).toLowerCase().indexOf(q) >= 0);
  }
  if (activeTags.size) {
    rows = rows.filter(({ m }) => (m.tags || []).some((t) => activeTags.has(t)));
  }
  return rows;
}
function renderMemos() {
  const root = $('list-memo'); root.innerHTML = '';
  const rows = filteredMemoRows();
  if (!rows.length) {
    const msg = (memoQuery || activeTags.size) ? '조건에 맞는 메모가 없어요' : '메모가 없어요';
    root.innerHTML = '<p style="color:var(--ink-soft);text-align:center;padding:40px 0">' + msg + '</p>';
    return;
  }
  rows.forEach(({ m }) => {
    const card = document.createElement('div');
    card.className = 'card'; card.style.background = blockBg(m);
    const row = document.createElement('div'); row.className = 'memo-row';
    const sq = document.createElement('span'); sq.className = 'sq'; sq.style.background = accent(m);
    const ti = document.createElement('div'); ti.className = 'm-title';
    ti.textContent = (m.pinned ? '📌 ' : '') + (plain(m.title).trim() || '제목 없음');
    row.appendChild(sq); row.appendChild(ti);
    card.appendChild(row);
    const prev = plain(m.content).trim();
    if (prev) {
      const pv = document.createElement('div'); pv.className = 'memo-prev'; pv.textContent = prev;
      card.appendChild(pv);
    }
    if ((m.tags || []).length) {
      const tg = document.createElement('div'); tg.className = 'm-tags';
      m.tags.forEach((t) => { const s = document.createElement('span'); s.textContent = '#' + t; tg.appendChild(s); });
      card.appendChild(tg);
    }
    card.addEventListener('click', () => openMemo(m.id, true));
    // 메모 블럭 꾹 누르기 → 상단 고정/색상/삭제
    addLongPress(card, (x, y) => openMenu(x, y, blockMenuRows(m, 'memos', () => { renderMemos(); renderDrawer(); })));
    root.appendChild(card);
  });
}
function allTags() {
  const set = new Set();
  (state.memos || []).forEach((m) => (m.tags || []).forEach((t) => set.add(t)));
  return [...set];
}
function renderTagBar() {
  const bar = $('tag-bar'); bar.innerHTML = '';
  const tags = allTags();
  bar.classList.toggle('hidden', curTab !== 'memo' || !tags.length);
  if (curTab !== 'memo' || !tags.length) { $('bt-add').classList.remove('raised'); return; }
  $('bt-add').classList.add('raised');
  tags.forEach((t) => {
    const b = document.createElement('button');
    b.textContent = '#' + t; b.className = activeTags.has(t) ? 'on' : '';
    b.addEventListener('click', () => {
      if (activeTags.has(t)) activeTags.delete(t); else activeTags.add(t);
      renderMemos(); renderTagBar();
    });
    bar.appendChild(b);
  });
}
function renderAll() { renderTodos(); renderMemos(); renderTagBar(); renderDrawer(); }

$('memo-search').addEventListener('input', (e) => { memoQuery = e.target.value.trim(); renderMemos(); });

/* ── 인덱스 드로어 ── */
function openDrawer() { renderDrawer(); $('drawer').classList.add('open'); ensureScrim(); }
function closeDrawer() { $('drawer').classList.remove('open'); const s = $('drawer-scrim'); if (s) s.remove(); }
function ensureScrim() {
  if ($('drawer-scrim')) return;
  const s = document.createElement('div'); s.id = 'drawer-scrim'; s.className = 'scrim';
  s.addEventListener('click', closeDrawer);
  document.body.appendChild(s);
}
function renderDrawer() {
  const root = $('drawer-list'); if (!root) return;
  root.innerHTML = '';
  const rows = memosInOrder();
  if (!rows.length) { root.innerHTML = '<p style="color:var(--ink-soft);padding:20px 14px">메모가 없어요</p>'; return; }
  let lastLabel = '␀';
  rows.forEach(({ m, label }) => {
    if (label !== lastLabel) {
      lastLabel = label;
      if (label) { const fl = document.createElement('div'); fl.className = 'dw-folder'; fl.textContent = '📁 ' + label; root.appendChild(fl); }
    }
    const it = document.createElement('div'); it.className = 'dw-item';
    const sq = document.createElement('span'); sq.className = 'sq'; sq.style.background = accent(m);
    const t = document.createElement('div'); t.className = 't';
    t.textContent = (m.pinned ? '📌 ' : '') + (plain(m.title).trim() || '제목 없음');
    it.appendChild(sq); it.appendChild(t);
    it.addEventListener('click', () => { closeDrawer(); setTab('memo'); openMemo(m.id, true); });
    // 인덱스 항목 꾹 누르기 → 우클릭과 같은 메뉴(고정/색상/삭제)
    addLongPress(it, (x, y) => openMenu(x, y, blockMenuRows(m, 'memos', () => { renderMemos(); renderDrawer(); })));
    root.appendChild(it);
  });
}
$('bt-menu').addEventListener('click', openDrawer);
// 화면 왼쪽 경계에서 안쪽으로 슬라이드 → 드로어 열기
(function () {
  let edge = null;
  document.addEventListener('touchstart', (e) => {
    if ($('pane-main').classList.contains('hidden')) { edge = null; return; }
    if (!$('sheet').classList.contains('hidden')) { edge = null; return; }
    const t = e.touches[0];
    edge = (t.clientX < 24) ? { x: t.clientX, y: t.clientY } : null;
  }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (!edge) return;
    const t = e.touches[0];
    if (t.clientX - edge.x > 48 && Math.abs(t.clientY - edge.y) < 45) { openDrawer(); edge = null; }
  }, { passive: true });
  document.addEventListener('touchend', () => { edge = null; });
})();

/* ── 메모 상세/편집 ── */
function openMemo(id, showSheet) {
  const m = (state.memos || []).find((x) => x.id === id);
  if (!m) { $('sheet').classList.add('hidden'); curMemoId = null; return; }
  curMemoId = id;
  $('dv-title').innerHTML = m.title || '';
  $('dv-content').innerHTML = m.content || '';
  const tg = $('dv-tags'); tg.innerHTML = '';
  (m.tags || []).forEach((t) => { const s = document.createElement('span'); s.textContent = '#' + t; tg.appendChild(s); });
  setEditing(false);
  if (showSheet) $('sheet').classList.remove('hidden');
}
function setEditing(on) {
  editing = on;
  $('sheet-body').classList.toggle('editing', on);
  $('dv-title').setAttribute('contenteditable', on ? 'true' : 'false');
  $('dv-content').setAttribute('contenteditable', on ? 'true' : 'false');
  $('dv-edit').classList.toggle('hidden', on);
  $('dv-save').classList.toggle('hidden', !on);
}
$('dv-back').addEventListener('click', () => {
  if (editing) saveMemo();
  $('sheet').classList.add('hidden'); curMemoId = null;
});
$('dv-edit').addEventListener('click', () => setEditing(true));
$('dv-save').addEventListener('click', () => { saveMemo(); setEditing(false); });
function saveMemo() {
  const m = (state.memos || []).find((x) => x.id === curMemoId);
  if (!m) return;
  m.title = $('dv-title').innerHTML;
  m.content = $('dv-content').innerHTML;
  m.updatedAt = Date.now();
  schedulePush(); renderMemos(); renderDrawer();
}
// 보기 모드에서 체크리스트(li) 탭 → 완료 토글 / 링크 탭 → 새 탭
$('dv-content').addEventListener('click', (e) => {
  if (editing) return;
  const a = e.target.closest && e.target.closest('.link');
  if (a) { window.open(a.dataset.href || a.textContent.trim(), '_blank'); return; }
  const li = e.target.closest && e.target.closest('ul.md-check > li');
  if (li) {
    li.classList.toggle('done');
    const m = (state.memos || []).find((x) => x.id === curMemoId);
    if (m) { m.content = $('dv-content').innerHTML; m.updatedAt = Date.now(); schedulePush(); renderMemos(); }
  }
});

/* ── 탭/추가/새로고침 ── */
function setTab(t) {
  curTab = t;
  $('tab-todo').classList.toggle('on', t === 'todo');
  $('tab-memo').classList.toggle('on', t === 'memo');
  $('list-todo').classList.toggle('hidden', t !== 'todo');
  $('memo-view').classList.toggle('hidden', t !== 'memo');
  renderTagBar();
}
$('tab-todo').addEventListener('click', () => setTab('todo'));
$('tab-memo').addEventListener('click', () => setTab('memo'));
$('bt-add').addEventListener('click', () => {
  if (curTab === 'todo') {
    (state.todos = state.todos || []).push({ id: uid(), title: '', color: 'var(--c0)', pinned: false, items: [{ id: uid(), text: '', done: false }] });
    schedulePush(); renderTodos();
  } else {
    const m = { id: uid(), title: '', content: '', tags: [], color: 'var(--c0)', folderId: null,
      pinned: false, pinnedAt: 0, createdAt: Date.now(), updatedAt: Date.now() };
    (state.memos = state.memos || []).push(m);
    schedulePush(); renderMemos(); renderDrawer(); openMemo(m.id, true); setEditing(true);
  }
});
$('bt-refresh').addEventListener('click', async () => {
  try { await pull(); renderAll(); toast('새로고침 ✓'); } catch (e) { toast('불러오기 실패'); }
});
document.addEventListener('visibilitychange', async () => {
  // 앱으로 돌아올 때 자동 새로고침(편집 중이면 보류)
  if (document.visibilityState === 'visible' && user && !editing) {
    try { await pull(); renderAll(); } catch (_) {}
  }
});

/* ── 시작 ── */
async function start() {
  await pull();
  renderAll(); setTab('todo');
  show('pane-main');
  subscribe();
}
(async function init() {
  const cfg = getConfig();
  if (!cfg) { show('pane-config'); return; }
  client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  const { data } = await client.auth.getUser().catch(() => ({ data: null }));
  user = data && data.user;
  if (!user) { show('pane-login'); return; }
  try { await start(); } catch (e) {
    show('pane-login'); $('lg-err').textContent = '불러오기 실패: ' + (e.message || e);
  }
})();
</script>

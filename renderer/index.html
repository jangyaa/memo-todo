<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memo Todo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- 커스텀 타이틀바: 좌측 크롬형 탭 + 우측 컨트롤 -->
    <header class="titlebar">
      <button class="profile-btn" id="btn-profile" title="프로필">♡</button>
      <div class="titlebar-tabs" id="tabs"></div>
      <div class="titlebar-drag"></div>
      <div class="titlebar-right">
        <button class="icon-btn" id="btn-sync" title="클라우드 동기화">☁</button>
        <button class="icon-btn" id="btn-min" title="최소화">─</button>
        <button class="icon-btn" id="btn-close" title="닫기">✕</button>
      </div>
    </header>

    <!-- ===================== 할 일(투두) 뷰 ===================== -->
    <section class="view view-todo" id="view-todo">
      <div class="todo-board" id="todo-board"></div>
      <button class="fab" id="btn-add-todo" title="할 일 추가">＋</button>
    </section>

    <!-- ===================== 메모 뷰 ===================== -->
    <section class="view view-memo" id="view-memo">
      <div class="memo-layout">
        <!-- 사이드 인덱스 -->
        <aside class="memo-index" id="memo-index">
          <div class="index-toolbar">
            <span class="index-title">Folder</span>
            <button class="icon-btn small" id="btn-add-folder" title="폴더 추가">＋</button>
          </div>
          <div class="index-list" id="index-list"></div>
        </aside>

        <!-- 메모 본문 -->
        <div class="memo-main">
          <div class="memo-tagbar" id="memo-tagbar"></div>
          <div class="findbar" id="findbar">
            <input type="text" id="find-input" placeholder="메모 내에서 검색 (Ctrl+F)" />
            <span class="find-count" id="find-count"></span>
            <button class="icon-btn small" id="find-prev" title="이전">▲</button>
            <button class="icon-btn small" id="find-next" title="다음">▼</button>
            <button class="icon-btn small" id="find-close" title="닫기">✕</button>
          </div>
          <div class="memo-page" id="memo-page"></div>
        </div>
      </div>
      <button class="fab" id="btn-add-memo" title="메모 추가">＋</button>
    </section>
  </div>

  <!-- 우클릭 컨텍스트 메뉴 -->
  <div class="ctx-menu" id="ctx-menu"></div>

  <!-- 프로필 드롭다운 (가운데 정렬 카드) -->
  <div class="profile-menu" id="profile-menu">
    <div class="pm-avatar" id="pm-avatar">♡</div>
    <button class="pm-image" id="pm-image">프로필 이미지 변경</button>
    <button class="pm-image" id="pm-theme">테마 변경</button>
  </div>
  <input type="file" id="profile-file" accept="image/*" style="display:none" />

  <!-- 테마 / 글꼴 설정 모달 -->
  <div class="modal-overlay" id="theme-overlay">
    <div class="modal">
      <div class="modal-head">
        <span>테마 변경</span>
        <button class="icon-btn" id="theme-close">✕</button>
      </div>
      <div class="theme-list" id="theme-list"></div>
      <div class="font-section">
        <div class="font-row">
          <span class="font-label">글꼴 (전체)</span>
          <select id="font-family"></select>
        </div>
        <div class="font-row">
          <span class="font-label">글자 크기 (전체)</span>
          <div class="font-size-ctl">
            <button id="font-dec">A-</button>
            <span id="font-size-val">100%</span>
            <button id="font-inc">A+</button>
          </div>
        </div>
        <p class="sync-hint">메모 본문은 서식 도구가 따로 있어 전체 글꼴 설정의 영향을 받지 않아요.</p>
      </div>
    </div>
  </div>

  <!-- 색상 선택 팝오버 (메모 색상 변경) -->
  <div class="color-pop" id="color-pop"></div>

  <!-- 메모 본문 텍스트 선택 시 뜨는 서식 툴바 -->
  <div class="format-toolbar" id="format-toolbar">
    <div class="ft-row">
      <button data-cmd="bold" title="굵게"><b>B</b></button>
      <button data-cmd="italic" title="기울임"><i>I</i></button>
      <button data-cmd="underline" title="밑줄"><u>U</u></button>
      <button data-cmd="strikeThrough" title="취소선"><s>S</s></button>
      <button data-cmd="hilite" class="ft-hl" title="형광펜"></button>
      <button data-cmd="removeFormat" class="ft-clear" title="서식 지우기">⌫</button>
    </div>
    <div class="ft-row">
      <span class="ft-tag">색</span>
      <span class="ft-colors" id="ft-colors"></span>
      <input type="text" id="ft-hex" class="ft-hex" placeholder="#hex" maxlength="7" />
    </div>
    <div class="ft-row">
      <span class="ft-tag">크기</span>
      <button data-size="dec" class="ft-az">A-</button>
      <button data-size="inc" class="ft-az">A+</button>
      <span class="ft-tag">글꼴</span>
      <select id="ft-font"></select>
    </div>
    <div class="ft-row">
      <span class="ft-tag">정렬</span>
      <button data-cmd="justifyLeft" title="왼쪽">≡</button>
      <button data-cmd="justifyCenter" title="가운데">≡</button>
      <button data-cmd="justifyRight" title="오른쪽">≡</button>
      <button data-cmd="quote" title="인용구">❝</button>
      <button data-cmd="link" title="링크">↗</button>
    </div>
  </div>

  <!-- ===================== 동기화 패널 ===================== -->
  <div class="modal-overlay" id="sync-overlay">
    <div class="modal">
      <div class="modal-head">
        <span>☁ 클라우드 동기화</span>
        <button class="icon-btn" id="sync-close">✕</button>
      </div>

      <div class="sync-pane" id="sync-not-configured">
        <p class="sync-msg">
          아직 동기화가 설정되지 않았어요.<br>
          앱 폴더의 <b>config.json</b> 에 Supabase 정보를 넣어주세요.
        </p>
        <p class="sync-hint">자세한 방법은 <b>SYNC-SETUP.md</b> 문서를 참고하세요.</p>
      </div>

      <div class="sync-pane" id="sync-signin">
        <input type="email" id="sync-email" placeholder="이메일" />
        <input type="password" id="sync-password" placeholder="비밀번호" />
        <div class="sync-btns">
          <button class="btn-primary" id="btn-signin">로그인</button>
          <button class="btn-ghost" id="btn-signup">회원가입</button>
        </div>
        <p class="sync-error" id="sync-error"></p>
      </div>

      <div class="sync-pane" id="sync-signedin">
        <p class="sync-msg">✅ <b id="sync-who"></b> 로 동기화 중</p>
        <p class="sync-hint" id="sync-last"></p>
        <div class="sync-btns">
          <button class="btn-primary" id="btn-sync-now">지금 동기화</button>
          <button class="btn-ghost" id="btn-signout">로그아웃</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memo Todo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- 커스텀 타이틀바 -->
    <header class="titlebar">
      <div class="titlebar-left">
        <span class="logo">🤍✦</span>
      </div>
      <div class="titlebar-tabs">
        <button class="tab active" data-view="todo">할 일</button>
        <button class="tab" data-view="memo">메모</button>
      </div>
      <div class="titlebar-right">
        <button class="icon-btn" id="btn-open-memo" title="메모 별도 창으로 열기">🗔</button>
        <button class="icon-btn" id="btn-pin" title="항상 위에 고정">📌</button>
        <button class="icon-btn" id="btn-min" title="최소화">─</button>
        <button class="icon-btn" id="btn-close" title="닫기">✕</button>
      </div>
    </header>

    <!-- ===================== 할 일(투두) 뷰 ===================== -->
    <section class="view view-todo active" id="view-todo">
      <div class="todo-toolbar">
        <div class="search-wrap">
          <input type="text" id="todo-search" class="search-input" placeholder="검색…" />
        </div>
        <button class="add-btn" id="btn-add-todo" title="할 일 추가">＋</button>
      </div>
      <div class="todo-board" id="todo-board"></div>
    </section>

    <!-- ===================== 메모 뷰 ===================== -->
    <section class="view view-memo" id="view-memo">
      <div class="memo-layout">
        <!-- 사이드 인덱스 -->
        <aside class="memo-index" id="memo-index">
          <div class="index-toolbar">
            <span class="index-title">목차</span>
            <div class="index-actions">
              <button class="icon-btn small" id="btn-add-folder" title="폴더 추가">🗀＋</button>
              <button class="icon-btn small" id="btn-add-memo" title="메모 추가">＋</button>
            </div>
          </div>
          <div class="index-list" id="index-list"></div>
        </aside>

        <!-- 메모 본문(한 페이지) -->
        <div class="memo-main">
          <div class="findbar" id="findbar">
            <input type="text" id="find-input" placeholder="메모 내에서 검색 (Ctrl+F)" />
            <span class="find-count" id="find-count"></span>
            <button class="icon-btn small" id="find-prev" title="이전">▲</button>
            <button class="icon-btn small" id="find-next" title="다음">▼</button>
            <button class="icon-btn small" id="find-close" title="닫기">✕</button>
          </div>
          <div class="memo-page" id="memo-page"></div>
        </div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>

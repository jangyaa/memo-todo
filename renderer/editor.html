<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>메모</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕",
        -apple-system, BlinkMacSystemFont, sans-serif;
      color: #2b2b2f; background: #fff; display: flex; flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    /* 네이버 블로그 느낌의 상단 툴바 */
    .ed-toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 3px;
      padding: 8px 12px; border-bottom: 1px solid #ececec; background: #fafafa;
      position: sticky; top: 0; z-index: 5;
    }
    .ed-toolbar button {
      min-width: 30px; height: 30px; border: none; background: transparent;
      border-radius: 7px; cursor: pointer; font-size: 14px; color: #3a3a3f;
      display: inline-flex; align-items: center; justify-content: center; padding: 0 6px;
    }
    .ed-toolbar button:hover { background: #ececec; }
    .ed-toolbar button svg { width: 16px; height: 16px; fill: currentColor; }
    .ed-sep { width: 1px; height: 18px; background: #e0e0e0; margin: 0 5px; }
    .ed-toolbar select {
      height: 30px; border: 1px solid #e2e2e2; border-radius: 7px; padding: 0 6px;
      font-size: 12px; font-family: inherit; background: #fff; cursor: pointer;
    }
    .ed-toolbar input[type="color"] {
      width: 30px; height: 26px; border: 1px solid #e2e2e2; border-radius: 7px;
      background: #fff; cursor: pointer; padding: 2px;
    }
    .ed-hl { fill: #ffcf3f; }

    .ed-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
    .ed-page { width: 100%; max-width: 720px; padding: 28px 40px 120px; }
    .ed-title {
      width: 100%; border: none; outline: none; background: transparent;
      font-size: 26px; font-weight: 800; color: #1f1f23; padding: 6px 0 10px;
      border-bottom: 1px solid #eee; margin-bottom: 18px;
    }
    .ed-title::placeholder { color: #c4c4c8; }
    .ed-body {
      outline: none; font-size: 16px; line-height: 1.9; color: #2b2b2f;
      min-height: 60vh; white-space: pre-wrap; word-break: break-word;
    }
    .ed-body:empty::before { content: "내용을 입력하세요"; color: #c4c4c8; }
    .ed-body img { max-width: 100%; height: auto; border-radius: 8px; margin: 6px 0; display: block; }
    .ed-body hr { border: none; border-top: 1px solid #e3e3e3; margin: 14px 0; }
    .ed-body blockquote {
      margin: 10px 0; padding: 6px 14px; border-left: 3px solid #d9d9d9; color: #6b6b70;
    }
    .ed-body ul, .ed-body ol { margin: 6px 0; padding-left: 24px; }
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-thumb { background: #d8d8d8; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #c2c2c2; }
  </style>
</head>
<body>
  <div class="ed-toolbar">
    <button data-cmd="bold" title="굵게"><b>B</b></button>
    <button data-cmd="italic" title="기울임"><i>I</i></button>
    <button data-cmd="underline" title="밑줄"><u>U</u></button>
    <button data-cmd="strikeThrough" title="취소선"><s>S</s></button>
    <button data-cmd="hilite" title="형광펜"><svg viewBox="0 0 20 20"><path d="M4 13 L12 5 L15 8 L7 16 L4 16 Z"/><rect class="ed-hl" x="3" y="18" width="14" height="2"/></svg></button>
    <span class="ed-sep"></span>
    <select id="ed-size" title="글자 크기">
      <option value="12pt">12</option>
      <option value="14pt">14</option>
      <option value="16pt" selected>16</option>
      <option value="18pt">18</option>
      <option value="22pt">22</option>
      <option value="28pt">28</option>
    </select>
    <input type="color" id="ed-color" value="#2b2b2f" title="글자색" />
    <span class="ed-sep"></span>
    <button data-cmd="justifyLeft" title="왼쪽"><svg viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="2"/><rect x="1" y="7" width="9" height="2"/><rect x="1" y="12" width="12" height="2"/></svg></button>
    <button data-cmd="justifyCenter" title="가운데"><svg viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="2"/><rect x="3.5" y="7" width="9" height="2"/><rect x="2" y="12" width="12" height="2"/></svg></button>
    <button data-cmd="justifyRight" title="오른쪽"><svg viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="2"/><rect x="6" y="7" width="9" height="2"/><rect x="3" y="12" width="12" height="2"/></svg></button>
    <span class="ed-sep"></span>
    <button data-cmd="insertUnorderedList" title="글머리 기호">•</button>
    <button data-cmd="insertOrderedList" title="번호 목록">1.</button>
    <button data-cmd="quote" title="인용구">❝</button>
    <button data-cmd="hr" title="구분선">―</button>
    <button data-cmd="image" title="이미지"><svg viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="5.5" cy="6" r="1.3"/><path d="M2.5 12 L6 8.5 L8.5 11 L11 7.5 L13.5 11" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
  </div>

  <div class="ed-scroll">
    <div class="ed-page">
      <input type="text" id="ed-title" class="ed-title" placeholder="제목" />
      <div id="ed-body" class="ed-body" contenteditable="true" spellcheck="false"></div>
    </div>
  </div>

  <input type="file" id="ed-image" accept="image/*" style="display:none" />
  <script src="editor.js"></script>
</body>
</html>
